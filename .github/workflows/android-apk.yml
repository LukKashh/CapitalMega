name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android/apk-cloud-build]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Build web application
        run: bun run build

      - name: Generate Android project and sync assets
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android
          chmod +x android/gradlew

      - name: Compile debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK and capture signing certificate
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cd android
          ./gradlew --no-daemon signingReport > ../signing-report.txt
          cd ..
          grep -q 'SHA1:' signing-report.txt

      - name: Upload APK and signing report
        uses: actions/upload-artifact@v4
        with:
          name: capital-fortune-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            signing-report.txt
          if-no-files-found: error
          retention-days: 14
