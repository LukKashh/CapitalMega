name: Android APK

on:
  push:
    branches:
      - android/capital-fortune-capacitor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and verify Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Build web application
        run: bun run build

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android
          chmod +x android/gradlew

      - name: Persist lockfile and generated Android project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(android): add generated native project [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: capital-fortune-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
