name: Validate Capital Fortune

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun run test

      - name: Apply Prettier formatting to PR files
        if: github.event_name == 'pull_request'
        run: |
          bunx prettier --write \
            src/components/game/AppShell.tsx \
            src/components/game/DeveloperTools.tsx \
            src/routes/auth.tsx \
            src/routes/index.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/components/game/AppShell.tsx \
              src/components/game/DeveloperTools.tsx \
              src/routes/auth.tsx \
              src/routes/index.tsx
            git commit -m "style: apply Prettier formatting to PR #8"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Run ESLint
        run: bun run lint

      - name: Create production build
        run: bun run build
