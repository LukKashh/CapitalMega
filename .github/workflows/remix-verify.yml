name: Remix verification

on:
  push:
    branches:
      - remix/supabase-android-independent
  pull_request:
    branches:
      - remix/supabase-android-independent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remix-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --no-frozen-lockfile
      - name: Apply lint autofixes
        run: pnpm exec eslint . --fix
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test -- --reporter=dot
      - name: Production build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: capital-fortune-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android-build:
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Android SDK packages
        run: SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}" && export PATH="$SDK_ROOT/cmdline-tools/16.0/bin:$SDK_ROOT/platform-tools:$PATH" && yes | "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --licenses && "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: corepack enable && pnpm install --no-frozen-lockfile
      - name: Build web assets
        run: pnpm build
      - name: Generate Android project
        run: pnpm exec cap add android
      - name: Sync Capacitor
        run: pnpm exec cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: capital-fortune-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
